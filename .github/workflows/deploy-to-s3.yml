# This is a basic workflow to help you get started with Actions

name: PushToS3

on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v3
        with:
          repository: OpenizePtyLtd/products.fileformat.app
          token: ${{ secrets.REPO_TOKEN }}
          submodules: true  
          fetch-depth: 0 

      - name: Setup hugo
        uses: peaceiris/actions-hugo@v2
        with:
           #hugo-version: 'latest'
          hugo-version: '0.110.0'
          

      - name: Build
        run: hugo --config products.fileformat.app.toml --minify
        
        # Deploys built website to S3
      - name: Deploy to S3
        run: hugo --config products.fileformat.app.toml deploy --force --maxDeletes -1 --invalidateCDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}
          
      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: '/*'
          AWS_REGION: 'us-west-2'
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

 
